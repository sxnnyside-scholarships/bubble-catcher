name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Just
        uses: extractions/setup-just@v2

      - name: Install dependencies
        run: just install

      - name: Verify quality gate
        run: just check

      - name: Build production bundles
        run: just build

      - name: Package self-hosted distribution
        run: just package

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            dist/bubble-catcher-selfhosted.tar.gz
