name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality-gate:
    name: Quality Gate (just check)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Just
        uses: extractions/setup-just@v2

      - name: Install dependencies
        run: just install

      - name: Run quality gate
        run: just check
        env:
          JWT_SECRET: test-jwt-secret-minimum-32-chars-long-for-ci
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/bubble_test

      - name: Build production artifacts
        run: just build
